name: Build Media Library Manager for Windows

on:
  push:
    branches: [ "main", "claude/**" ]
    paths:
      - "media-library-manager/**"
      - ".github/workflows/build-media-library-windows.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "media-library-manager/**"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: media-library-manager

jobs:
  build:
    runs-on: windows-latest
    env:
      # A free Castlabs EVS account, used to VMP-sign the app so Widevine loads in the installed
      # build. Absent (e.g. on forks) → signing is skipped and DRM channels won't play.
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: media-library-manager/package-lock.json

      # The Widevine-enabled Electron (for live TV) is a GitHub dep that npm pins as git+ssh;
      # fetch it over HTTPS so no SSH key is needed in CI.
      - name: Use HTTPS for GitHub git deps
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install dependencies
        run: npm ci

      # npm records only the host platform's optional native binaries in a lockfile, so a lockfile
      # generated on Linux leaves out Rollup's and esbuild's Windows binaries (Vite needs them to
      # build). npm ci passes but skips them; pull them in explicitly for this Windows runner.
      - name: Install Windows native build binaries (npm optional-dep workaround)
        run: npm install --no-save "@rollup/rollup-win32-x64-msvc@4.62.4" "@esbuild/win32-x64@0.25.12"

      # Needed to VMP-sign the app for Widevine (DRM live TV). Skipped without the EVS account.
      - name: Install Widevine VMP signing tool
        if: ${{ env.EVS_ACCOUNT_NAME != '' }}
        working-directory: ${{ github.workspace }}
        run: python -m pip install --upgrade castlabs-evs

      - name: Typecheck
        run: npm run typecheck

      - name: Test (in-app torrent downloads, against a local seeder)
        run: npm test

      # Version shown in Settings: 0.2.<build number>.
      - name: Set version from build number
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: |
          npm run build
          npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-library-manager-setup
          path: media-library-manager/release/media-library-manager-setup.exe
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mlm-win-build-${{ github.run_number }}
          name: Media Library Manager for Windows, build ${{ github.run_number }}
          body: |
            Automated build of the Media Library Manager desktop app for Windows (64-bit).

            `media-library-manager-setup.exe` isn't code-signed, so Windows SmartScreen may
            say "Windows protected your PC" — click "More info", then "Run anyway".
            Installing over a previous version keeps your settings and library.
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: media-library-manager/release/media-library-manager-setup.exe
