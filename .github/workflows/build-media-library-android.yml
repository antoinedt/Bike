name: Build Media Library Manager APK

on:
  push:
    branches: [ "main", "claude/**" ]
    paths:
      - "media-library-manager-android/**"
      - ".github/workflows/build-media-library-android.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "media-library-manager-android/**"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: media-library-manager-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3's default package list included the long-removed legacy "tools"
          # package, which now makes sdkmanager fail outright ("Failed to find
          # package 'tools'"). Explicitly request only platform-tools here;
          # the next step installs the specific platform/build-tools we need.
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk media-library-manager-debug.apk

      - name: Check the torrent library's native code is in the APK
        run: |
          unzip -l media-library-manager-debug.apk | grep libtorrent4j.so
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l media-library-manager-debug.apk | grep -q "lib/$abi/libtorrent4j.so" || { echo "missing lib/$abi/libtorrent4j.so"; exit 1; }
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-library-manager-debug-apk
          path: media-library-manager-android/media-library-manager-debug.apk
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mlm-build-${{ github.run_number }}
          name: Media Library Manager debug build ${{ github.run_number }}
          body: |
            Automated debug build of the Media Library Manager Android app.

            `media-library-manager-debug.apk` is signed with a fixed, committed
            debug keystore (same one the Bike app uses), so it updates in place
            over a previous build — you'll still need to allow "install unknown
            apps" since it isn't a Play Store release. If you get "App not
            installed" anyway, it's from a build before this keystore was added
            (mlm-build-8 or earlier) — uninstall that one first, then install
            this one; from here on, updates should install directly.
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: media-library-manager-android/media-library-manager-debug.apk
